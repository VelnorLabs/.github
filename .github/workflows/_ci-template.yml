# ---------------------------------------------------------------------------
# VelnorLabs shared CI template · T-W0-011
#
# Callable via `workflow_call` so each service repo's ci.yml stays ~10 lines.
# Provides: lint → unit-tests → build → Trivy scan → SBOM → cosign → ECR push
#
# Stage 1 (lint-unit-scan): runs on every PR + push
# Stage 2 (build-sign-push): runs only on merge to main
#
# Usage in a caller repo (.github/workflows/ci.yml):
#
#   jobs:
#     ci:
#       uses: VelnorLabs/.github/.github/workflows/_ci-template.yml@main
#       with:
#         language: go
#         service-name: velnor-chat-api
#       secrets: inherit
#
# Invariants enforced:
#   - Pinned action SHAs (Invariant §4)
#   - OIDC auth — no static AWS keys (T-W0-010 requirement)
#   - Trivy scan on every build (security-review baseline)
#   - SBOM generated via Syft on every build
#   - cosign KMS sign on every ECR push (DEC-0039 / Invariant §3)
#   - PII lint on every run
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      language:
        description: 'go, python, or terraform'
        required: true
        type: string
      service-name:
        description: 'ECR repo name (e.g. velnor-chat-api)'
        required: true
        type: string
      run-eval:
        description: 'Whether to run eval subset'
        required: false
        type: boolean
        default: false
      go-version:
        description: 'Go toolchain version (used when language=go)'
        required: false
        type: string
        default: '1.25'
      python-version:
        description: 'Python version (used when language=python)'
        required: false
        type: string
        default: '3.12'
      tfsec-version:
        description: 'tfsec version (used when language=terraform)'
        required: false
        type: string
        default: 'latest'
      aws-region:
        description: 'AWS region for ECR + OIDC'
        required: false
        type: string
        default: 'us-east-1'
      health-check:
        description: 'Run a container boot smoke test (curl /healthz, assert /readyz=503) after build. Enable for service repos.'
        required: false
        type: boolean
        default: false
      health-port:
        description: 'Container port the service listens on for the smoke test'
        required: false
        type: string
        default: '8080'
    outputs:
      image-uri:
        description: 'Full ECR URI of the signed image (empty if build-sign-push skipped)'
        value: ${{ jobs.build-sign-push.outputs.image-uri }}

env:
  AWS_REGION: ${{ inputs.aws-region }}
  ECR_REGISTRY: '${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com'
  COSIGN_KMS_KEY: 'awskms:///arn:aws:kms:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:alias/velnor-cosign-signing-v1'
  GHA_ROLE_ARN: 'arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/velnor-github-actions'

# ---------------------------------------------------------------------------
# Stage 1: PR checks — lint + unit tests + build + Trivy + SBOM + PII lint
# Runs on every push/PR event (workflow_call passes through the trigger).
# ---------------------------------------------------------------------------
jobs:
  lint-unit-scan:
    name: Stage 1 · lint → unit → build → Trivy → SBOM → PII lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write    # required for SBOM attestation + potential future OIDC use
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Language setup — Go or Python
      # -----------------------------------------------------------------------
      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      # -----------------------------------------------------------------------
      # Lint — Go: golangci-lint; Python: ruff + mypy
      # -----------------------------------------------------------------------
      - name: Lint (Go — golangci-lint)
        if: inputs.language == 'go'
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa  # v7.0.1
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Install Python dependencies (project + lint tools)
        if: inputs.language == 'python'
        run: |
          # Install the project's own deps first so mypy/ruff resolve imports.
          if [ -f requirements-dev.txt ]; then
            pip install --quiet -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install --quiet -r requirements.txt
          fi
          if [ -f pyproject.toml ]; then
            pip install --quiet -e ".[dev]" 2>/dev/null || pip install --quiet -e . 2>/dev/null || true
          fi
          pip install --quiet ruff mypy

      - name: Lint (Python — ruff check)
        if: inputs.language == 'python'
        run: ruff check .

      - name: Lint (Python — mypy)
        if: inputs.language == 'python'
        run: |
          if [ -f mypy.ini ] || [ -f setup.cfg ] || [ -f pyproject.toml ]; then
            # --ignore-missing-imports: third-party libs without type stubs
            # (boto3, structlog, unstructured, …) must not fail the type check.
            mypy --ignore-missing-imports .
          else
            echo "No mypy config found — skipping mypy."
          fi

      # -----------------------------------------------------------------------
      # Unit tests — Go: go test ./...; Python: pytest
      # -----------------------------------------------------------------------
      - name: Unit tests (Go)
        if: inputs.language == 'go'
        run: go test -race -count=1 ./...

      - name: Install Python test dependencies
        if: inputs.language == 'python'
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install --quiet -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install --quiet -r requirements.txt
          fi
          pip install --quiet pytest

      - name: Unit tests (Python — pytest)
        if: inputs.language == 'python'
        run: pytest --tb=short -q

      # -----------------------------------------------------------------------
      # IaC lint — tfsec for Terraform/OpenTofu repos (language=terraform)
      # Scans for security misconfigurations in HCL; fails on HIGH/CRITICAL.
      # -----------------------------------------------------------------------
      - name: Install tfsec (IaC lint)
        if: inputs.language == 'terraform'
        run: |
          TFSEC_VERSION="${{ inputs.tfsec-version }}"
          if [ "$TFSEC_VERSION" = "latest" ]; then
            TFSEC_VERSION=$(curl -s https://api.github.com/repos/aquasecurity/tfsec/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          fi
          echo "Installing tfsec $TFSEC_VERSION"
          curl -sLo tfsec "https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64"
          chmod +x tfsec
          sudo mv tfsec /usr/local/bin/tfsec
          tfsec --version

      - name: tfsec IaC scan
        if: inputs.language == 'terraform'
        run: |
          # Inline output; fails on HIGH/CRITICAL. (SARIF upload to GitHub Security
          # is omitted — code scanning is unavailable on Free-plan private repos.)
          tfsec . --severity HIGH,CRITICAL --no-color

      # -----------------------------------------------------------------------
      # Build container image (local — not pushed yet)
      # Skipped for terraform language (no container artifact).
      # -----------------------------------------------------------------------
      - name: Build container image
        if: inputs.language != 'terraform'
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t "${{ inputs.service-name }}:${{ github.sha }}" \
            .

      # -----------------------------------------------------------------------
      # Container boot smoke test — service repos only (health-check: true).
      # Asserts the image boots, /healthz is reachable, and /readyz returns 503
      # before dependencies are wired (the Velnor service convention).
      # -----------------------------------------------------------------------
      - name: Container boot smoke test
        if: inputs.language != 'terraform' && inputs.health-check
        run: |
          PORT="${{ inputs.health-port }}"
          docker run -d --name smoke-${{ inputs.service-name }} \
            -p "${PORT}:${PORT}" "${{ inputs.service-name }}:${{ github.sha }}"
          sleep 5
          curl -sf "http://localhost:${PORT}/healthz"
          STATUS=$(curl -o /dev/null -w "%{http_code}" "http://localhost:${PORT}/readyz")
          echo "readyz status: $STATUS"
          if [ "$STATUS" = "503" ]; then
            echo "readyz correctly 503 (deps not wired in CI)"
          else
            echo "unexpected readyz status: $STATUS"; docker logs smoke-${{ inputs.service-name }}; exit 1
          fi
          docker stop smoke-${{ inputs.service-name }}

      # -----------------------------------------------------------------------
      # Trivy vulnerability scan — fail on CRITICAL or HIGH
      # Skipped for terraform language (tfsec handles IaC scanning above).
      # -----------------------------------------------------------------------
      - name: Trivy vulnerability scan
        if: inputs.language != 'terraform'
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.24.0
        with:
          image-ref: '${{ inputs.service-name }}:${{ github.sha }}'
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
        # SARIF upload to GitHub Security is omitted — code scanning is unavailable
        # on Free-plan private repos. Trivy still fails the build on CRITICAL/HIGH.

      # -----------------------------------------------------------------------
      # SBOM — Syft generates CycloneDX SBOM and attaches it as a workflow artifact
      # Skipped for terraform language (no container image to generate SBOM from).
      # -----------------------------------------------------------------------
      # Only after a successful build (the image must exist), and never fatal —
      # the SBOM is an artifact, not a merge gate.
      - name: Generate SBOM (Syft)
        if: inputs.language != 'terraform' && success()
        continue-on-error: true
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532  # v0.17.0
        with:
          image: '${{ inputs.service-name }}:${{ github.sha }}'
          format: cyclonedx-json
          artifact-name: 'sbom-${{ inputs.service-name }}-${{ github.sha }}.cdx.json'
          output-file: sbom.cdx.json

      # -----------------------------------------------------------------------
      # PII lint — scan source for PII leakage patterns in log/span/metric calls
      # Runs after other steps so failures from Trivy/tests are visible too
      # -----------------------------------------------------------------------
      - name: PII lint
        if: always()
        run: |
          if [ -f scripts/pii_lint.py ]; then
            python3 scripts/pii_lint.py --root .
          else
            # Fall back to VelnorLabs/.github copy if running from a service repo
            # that hasn't vendored the script yet
            echo "scripts/pii_lint.py not found in this repo — skipping PII lint."
            echo "Add 'uses: VelnorLabs/.github' step or copy scripts/pii_lint.py to enable."
          fi

  # ---------------------------------------------------------------------------
  # Stage 2: Build + sign + push to ECR (only on merge to main)
  # Requires Stage 1 to pass. Skipped on PRs.
  # ---------------------------------------------------------------------------
  build-sign-push:
    name: Stage 2 · build → push → cosign sign
    needs: lint-unit-scan
    # Also gated on AWS_ACCOUNT_ID being set — until the dev/staging/prod account
    # vars are wired (per-environment, see Wave-0 follow-up), the ECR push + OIDC
    # cannot work; skip Stage 2 cleanly so push-to-main stays green on Stage 1.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && inputs.language != 'terraform' && vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write    # OIDC token for AWS + cosign
      contents: read
    outputs:
      image-uri: ${{ steps.image-meta.outputs.image-uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # -----------------------------------------------------------------------
      # OIDC: assume velnor-github-actions role — no static AWS keys
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: ${{ env.GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-ci-${{ inputs.service-name }}-${{ github.run_id }}

      - name: Verify AWS identity (OIDC smoke test)
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076  # v2.0.1

      # -----------------------------------------------------------------------
      # Build, tag, and push
      # -----------------------------------------------------------------------
      - name: Compute image URI
        id: image-meta
        run: |
          IMAGE_URI="${{ env.ECR_REGISTRY }}/${{ inputs.service-name }}:${{ github.sha }}"
          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Building and pushing: $IMAGE_URI"

      - name: Build Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t "${{ steps.image-meta.outputs.image-uri }}" \
            .

      - name: Push image to ECR
        run: docker push "${{ steps.image-meta.outputs.image-uri }}"

      # -----------------------------------------------------------------------
      # cosign KMS sign — uses velnor-cosign-signing-v1 key (T-W0-009)
      # KMS key rotation handled at the alias level; no workflow change needed.
      # -----------------------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da  # v3.7.0

      - name: Sign image with cosign (KMS)
        run: |
          cosign sign --yes \
            --key "${{ env.COSIGN_KMS_KEY }}" \
            "${{ steps.image-meta.outputs.image-uri }}"

      # -----------------------------------------------------------------------
      # Attach SBOM as a cosign attestation (optional — skipped if Syft unavailable)
      # -----------------------------------------------------------------------
      - name: Generate SBOM for signed image (Syft)
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532  # v0.17.0
        with:
          image: '${{ steps.image-meta.outputs.image-uri }}'
          format: cyclonedx-json
          artifact-name: 'sbom-${{ inputs.service-name }}-${{ github.sha }}.cdx.json'
          output-file: sbom.cdx.json

      - name: Attest SBOM with cosign (KMS)
        run: |
          cosign attest --yes \
            --key "${{ env.COSIGN_KMS_KEY }}" \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${{ steps.image-meta.outputs.image-uri }}"
