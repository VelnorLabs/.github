# ---------------------------------------------------------------------------
# VelnorLabs shared CI template · T-W0-011
#
# Callable via `workflow_call` so each service repo's ci.yml stays ~10 lines.
# Provides: lint → unit-tests → build → Trivy scan → SBOM → cosign → ECR push
#
# Stage 1 (lint-unit-scan): runs on every PR + push
# Stage 2 (build-sign-push): runs only on merge to main
#
# Usage in a caller repo (.github/workflows/ci.yml):
#
#   jobs:
#     ci:
#       uses: VelnorLabs/.github/.github/workflows/_ci-template.yml@main
#       with:
#         language: go
#         service-name: velnor-chat-api
#       secrets: inherit
#
# Invariants enforced:
#   - Pinned action SHAs (Invariant §4)
#   - OIDC auth — no static AWS keys (T-W0-010 requirement)
#   - Trivy scan on every build (security-review baseline)
#   - SBOM generated via Syft on every build
#   - cosign KMS sign on every ECR push (DEC-0039 / Invariant §3)
#   - PII lint on every run
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      language:
        description: 'go, python, or terraform'
        required: true
        type: string
      service-name:
        description: 'ECR repo name (e.g. velnor-chat-api)'
        required: true
        type: string
      run-eval:
        description: 'Whether to run eval subset'
        required: false
        type: boolean
        default: false
      go-version:
        # Pinned to an exact patch (not the floating '1.25') so a security-fix
        # toolchain is deterministic across all Go services. 1.25.12 resolves the
        # Go stdlib CVE-2026-39822 (HIGH — os.Root symlink-following) that the
        # Trivy gate flags on the built binary; the floating '1.25' had gone
        # stale at 1.25.11 (< fixed 1.25.12). Bump this line when the next Go
        # security patch lands. (LE-095)
        description: 'Go toolchain version (used when language=go)'
        required: false
        type: string
        default: '1.25.12'
      python-version:
        description: 'Python version (used when language=python)'
        required: false
        type: string
        default: '3.12'
      tfsec-version:
        # DEPRECATED AND IGNORED (LE-439). tfsec was replaced by Trivy's config
        # scanner in Stage 1; nothing reads this any more. It is retained rather
        # than deleted only because removing a workflow_call input is a breaking
        # change for any caller that still passes it — a caller passing an input
        # the workflow does not declare fails to start, and a failure to start
        # produces no job and no log (LE-397). No caller in the org passes it
        # today; delete this once that has been confirmed against every repo's
        # default branch rather than against local checkouts.
        description: 'DEPRECATED, ignored — tfsec was replaced by Trivy (LE-439)'
        required: false
        type: string
        default: 'latest'
      aws-region:
        description: 'AWS region for ECR + OIDC'
        required: false
        type: string
        default: 'us-east-1'
      health-check:
        description: 'Run a container boot smoke test (curl /healthz, assert /readyz=503) after build. Enable for service repos.'
        required: false
        type: boolean
        default: false
      health-port:
        description: 'Container port the service listens on for the smoke test'
        required: false
        type: string
        default: '8080'
    outputs:
      image-uri:
        description: 'Full ECR URI of the signed image (empty if build-sign-push skipped)'
        value: ${{ jobs.build-sign-push.outputs.image-uri }}

env:
  AWS_REGION: ${{ inputs.aws-region }}
  ECR_REGISTRY: '${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com'
  COSIGN_KMS_KEY: 'awskms:///arn:aws:kms:us-east-1:${{ vars.AWS_ACCOUNT_ID }}:alias/velnor-cosign-signing-v1'
  GHA_ROLE_ARN: 'arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/velnor-github-actions'

# ---------------------------------------------------------------------------
# Stage 1: PR checks — lint + unit tests + build + Trivy + SBOM + PII lint
# Runs on every push/PR event (workflow_call passes through the trigger).
# ---------------------------------------------------------------------------
jobs:
  lint-unit-scan:
    name: Stage 1 · lint → unit → build → Trivy → SBOM → PII lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write    # required for SBOM attestation + potential future OIDC use
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Language setup — Go or Python
      # -----------------------------------------------------------------------
      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b  # v5.4.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      # Allow `go get`/build to fetch private VelnorLabs Go modules (e.g. the
      # platform SDK). GOPRIVATE skips the checksum/proxy; the git rewrite uses
      # VELNOR_SDK_READ_TOKEN (a repo secret) for HTTPS auth. The git rewrite is
      # skipped when the secret is absent (repos with no private Go deps).
      - name: Configure private Go module access
        if: inputs.language == 'go'
        env:
          VELNOR_SDK_READ_TOKEN: ${{ secrets.VELNOR_SDK_READ_TOKEN }}
        run: |
          echo "GOPRIVATE=github.com/VelnorLabs/*" >> "$GITHUB_ENV"
          if [ -n "${VELNOR_SDK_READ_TOKEN}" ]; then
            git config --global url."https://x-access-token:${VELNOR_SDK_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      # Allow pip to install the private platform SDK via a git+https requirement.
      # Rewrites github.com HTTPS auth using VELNOR_SDK_READ_TOKEN (a repo secret);
      # skipped when the secret is absent (repos with no private git deps).
      - name: Configure private pip (git) access
        if: inputs.language == 'python'
        env:
          VELNOR_SDK_READ_TOKEN: ${{ secrets.VELNOR_SDK_READ_TOKEN }}
        run: |
          if [ -n "${VELNOR_SDK_READ_TOKEN}" ]; then
            git config --global url."https://x-access-token:${VELNOR_SDK_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      # -----------------------------------------------------------------------
      # Lint — Go: golangci-lint; Python: ruff + mypy
      # -----------------------------------------------------------------------
      - name: Lint (Go — golangci-lint)
        if: inputs.language == 'go'
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa  # v7.0.1
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Install Python dependencies (project + lint tools)
        if: inputs.language == 'python'
        run: |
          # Install the project's own deps first so mypy/ruff resolve imports.
          if [ -f requirements-dev.txt ]; then
            pip install --quiet -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install --quiet -r requirements.txt
          fi
          # For pyproject-only projects, install the package + dev extra. Fail
          # loudly if it errors (a swallowed failure here means missing deps and
          # confusing downstream errors). The no-extra fallback covers projects
          # without a [dev] optional-dependencies group.
          if [ -f pyproject.toml ]; then
            pip install --quiet -e ".[dev]" || pip install --quiet -e .
          fi
          # Pin ruff + mypy so CI matches local tooling (their rules tighten
          # across releases; unpinned drift produces CI-only lint/type failures).
          pip install --quiet "ruff==0.15.17" "mypy==2.1.0"

      - name: Lint (Python — ruff check)
        if: inputs.language == 'python'
        run: ruff check .

      - name: Lint (Python — mypy)
        if: inputs.language == 'python'
        run: |
          if [ -f mypy.ini ] || [ -f setup.cfg ] || [ -f pyproject.toml ]; then
            # --ignore-missing-imports: third-party libs without type stubs
            # (boto3, structlog, unstructured, …) must not fail the type check.
            mypy --ignore-missing-imports .
          else
            echo "No mypy config found — skipping mypy."
          fi

      # -----------------------------------------------------------------------
      # Unit tests — Go: go test ./...; Python: pytest
      # -----------------------------------------------------------------------
      - name: Unit tests (Go)
        if: inputs.language == 'go'
        run: go test -race -count=1 ./...

      - name: Install Python test dependencies
        if: inputs.language == 'python'
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install --quiet -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install --quiet -r requirements.txt
          fi
          pip install --quiet pytest

      - name: Unit tests (Python — pytest)
        if: inputs.language == 'python'
        run: pytest --tb=short -q

      # -----------------------------------------------------------------------
      # IaC misconfiguration scan — Trivy, for Terraform/OpenTofu repos.
      #
      # THIS REPLACED tfsec (LE-439). Three things were wrong with the step that
      # used to live here, and they compounded:
      #
      #   1. It resolved the version with an UNAUTHENTICATED call to the GitHub
      #      API's /releases/latest, drawing on the 60-requests-per-hour-per-IP
      #      anonymous budget shared by every Actions runner on that IP. So it
      #      rate-limited intermittently and failed PRs in every repo for reasons
      #      having nothing to do with their content.
      #   2. It had no error handling: a rate-limit body is a dict with 'message'
      #      and no 'tag_name', so the failure surfaced as a bare Python KeyError
      #      that pointed at JSON parsing rather than at the network. velnor-iac
      #      PR #289 died this way in 26 seconds.
      #   3. tfsec is DEPRECATED — Aqua folded it into Trivy — so this resolved
      #      'latest' from a project that has stopped releasing.
      #
      # Trivy's config scanner IS where tfsec's checks went, and Trivy is already
      # pinned and used below, so this removes the dependency rather than pinning
      # it. No network call, no unpinned version, no abandoned scanner.
      #
      # Verified before the swap, on velnor-iac at this severity: 0 findings, so
      # no repo turns red on adoption — and 30 findings at lower severities plus
      # 6 HIGH on a deliberately-bad fixture, so the zero is a real clean result
      # rather than a scanner that ran over nothing.
      # -----------------------------------------------------------------------
      # THE SCANNER VERSION IS PINNED HERE, EXPLICITLY, and that is the whole
      # point of the step. LE-439 was filed because a security scanner was
      # resolved at run time; shipping a replacement whose scanner version is
      # decided by whatever an action release happens to bundle would have been
      # the same defect with a different owner.
      #
      # Why this action ref and not v0.24.0: v0.24.0 is a DOCKER action wired to
      # ghcr.io/aquasecurity/trivy:0.53.0 with no way to choose the binary. 0.53.0
      # still carries AVD-AWS-0057 ("IAM policy document uses sensitive action on
      # wildcarded resource"), a check Aqua has since RETIRED — it does not exist
      # in current Trivy at any severity. It fires 53 times across velnor-iac and
      # turned that repo's CI red. v0.36.0 installs the binary via setup-trivy and
      # takes a `version` input, so the scanner is chosen by this file.
      #
      # The image scan below deliberately stays on v0.24.0: bumping it changes
      # which CVEs fail every Go and Python service repo, which is a separate
      # decision from IaC scanning and must not ride along on this one.
      #
      # Verified against velnor-iac with the exact binary named below, run from
      # the official image rather than a local install:
      #   docker run ghcr.io/aquasecurity/trivy:0.70.0 config . \
      #     --severity CRITICAL,HIGH --exit-code 1   ->  exit 0, 0 findings
      # plus 30 findings at lower severities (so the zero is a real clean result,
      # not a scan over nothing) and 6 HIGH on a deliberately-bad fixture (so the
      # gate bites). Re-run those three when bumping `version`.
      - name: Trivy IaC misconfiguration scan
        if: inputs.language == 'terraform'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          hide-progress: true
          # Pinned on purpose — see above. Not 'latest', and not the action's
          # default, even though they coincide today.
          version: v0.70.0
        # SARIF upload to GitHub Security is omitted — code scanning is
        # unavailable on Free-plan private repos, same as the image scan below.

      # -----------------------------------------------------------------------
      # Build container image (local — not pushed yet)
      # Skipped for terraform language (no container artifact).
      # -----------------------------------------------------------------------
      - name: Build container image
        if: inputs.language != 'terraform'
        env:
          # Forwarded to the Docker build as a BuildKit secret so the build can
          # fetch private VelnorLabs Go modules (the platform SDK). Empty for
          # repos with no private deps — the Dockerfile skips the git rewrite.
          VELNOR_SDK_READ_TOKEN: ${{ secrets.VELNOR_SDK_READ_TOKEN }}
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --secret id=velnor_sdk_token,env=VELNOR_SDK_READ_TOKEN \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t "${{ inputs.service-name }}:${{ github.sha }}" \
            .

      # -----------------------------------------------------------------------
      # Container boot smoke test — service repos only (health-check: true).
      # Asserts the image boots, /healthz is reachable, and /readyz returns 503
      # before dependencies are wired (the Velnor service convention).
      # -----------------------------------------------------------------------
      - name: Container boot smoke test
        if: inputs.language != 'terraform' && inputs.health-check
        run: |
          PORT="${{ inputs.health-port }}"
          docker run -d --name smoke-${{ inputs.service-name }} \
            -p "${PORT}:${PORT}" "${{ inputs.service-name }}:${{ github.sha }}"
          sleep 5
          curl -sf "http://localhost:${PORT}/healthz"
          STATUS=$(curl -o /dev/null -w "%{http_code}" "http://localhost:${PORT}/readyz")
          echo "readyz status: $STATUS"
          if [ "$STATUS" = "503" ]; then
            echo "readyz correctly 503 (deps not wired in CI)"
          else
            echo "unexpected readyz status: $STATUS"; docker logs smoke-${{ inputs.service-name }}; exit 1
          fi
          docker stop smoke-${{ inputs.service-name }}

      # -----------------------------------------------------------------------
      # Trivy vulnerability scan — fail on CRITICAL or HIGH
      # Skipped for terraform language: this scans a container IMAGE and a
      # terraform repo builds none. Terraform gets the Trivy CONFIG scan above
      # instead — same scanner, different scan type, not an exemption.
      # -----------------------------------------------------------------------
      - name: Trivy vulnerability scan
        if: inputs.language != 'terraform'
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.24.0
        with:
          image-ref: '${{ inputs.service-name }}:${{ github.sha }}'
          format: table
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
        # SARIF upload to GitHub Security is omitted — code scanning is unavailable
        # on Free-plan private repos. Trivy still fails the build on CRITICAL/HIGH.

      # -----------------------------------------------------------------------
      # SBOM — Syft generates CycloneDX SBOM and attaches it as a workflow artifact
      # Skipped for terraform language (no container image to generate SBOM from).
      # -----------------------------------------------------------------------
      # Only after a successful build (the image must exist), and never fatal —
      # the SBOM is an artifact, not a merge gate.
      - name: Generate SBOM (Syft)
        if: inputs.language != 'terraform' && success()
        continue-on-error: true
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532  # v0.17.0
        with:
          image: '${{ inputs.service-name }}:${{ github.sha }}'
          format: cyclonedx-json
          artifact-name: 'sbom-${{ inputs.service-name }}-${{ github.sha }}.cdx.json'
          output-file: sbom.cdx.json

      # -----------------------------------------------------------------------
      # PII lint — scan source for PII leakage patterns in log/span/metric calls
      # Runs after other steps so failures from Trivy/tests are visible too
      # -----------------------------------------------------------------------
      - name: PII lint
        if: always()
        run: |
          if [ -f scripts/pii_lint.py ]; then
            python3 scripts/pii_lint.py --root .
          else
            # Fall back to VelnorLabs/.github copy if running from a service repo
            # that hasn't vendored the script yet
            echo "scripts/pii_lint.py not found in this repo — skipping PII lint."
            echo "Add 'uses: VelnorLabs/.github' step or copy scripts/pii_lint.py to enable."
          fi

  # ---------------------------------------------------------------------------
  # Stage 2: Build + sign + push to ECR (only on merge to main)
  # Requires Stage 1 to pass. Skipped on PRs.
  # ---------------------------------------------------------------------------
  build-sign-push:
    name: Stage 2 · build → push → cosign sign
    needs: lint-unit-scan
    # Also gated on AWS_ACCOUNT_ID being set — until the dev/staging/prod account
    # vars are wired (per-environment, see Wave-0 follow-up), the ECR push + OIDC
    # cannot work; skip Stage 2 cleanly so push-to-main stays green on Stage 1.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && inputs.language != 'terraform' && vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      id-token: write    # OIDC token for AWS + cosign
      contents: read
    outputs:
      image-uri: ${{ steps.image-meta.outputs.image-uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # -----------------------------------------------------------------------
      # OIDC: assume velnor-github-actions role — no static AWS keys
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: ${{ env.GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-ci-${{ inputs.service-name }}-${{ github.run_id }}

      - name: Verify AWS identity (OIDC smoke test)
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076  # v2.0.1

      # -----------------------------------------------------------------------
      # Build, tag, and push
      # -----------------------------------------------------------------------
      - name: Compute image URI
        id: image-meta
        run: |
          IMAGE_URI="${{ env.ECR_REGISTRY }}/${{ inputs.service-name }}:${{ github.sha }}"
          echo "image-uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Building and pushing: $IMAGE_URI"

      - name: Build Docker image
        env:
          VELNOR_SDK_READ_TOKEN: ${{ secrets.VELNOR_SDK_READ_TOKEN }}
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --secret id=velnor_sdk_token,env=VELNOR_SDK_READ_TOKEN \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t "${{ steps.image-meta.outputs.image-uri }}" \
            .

      - name: Push image to ECR
        run: docker push "${{ steps.image-meta.outputs.image-uri }}"

      # -----------------------------------------------------------------------
      # cosign KMS sign — uses velnor-cosign-signing-v1 key (T-W0-009)
      # KMS key rotation handled at the alias level; no workflow change needed.
      # -----------------------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da  # v3.7.0

      - name: Sign image with cosign (KMS)
        run: |
          cosign sign --yes \
            --key "${{ env.COSIGN_KMS_KEY }}" \
            "${{ steps.image-meta.outputs.image-uri }}"

      # -----------------------------------------------------------------------
      # Attach SBOM as a cosign attestation (optional — skipped if Syft unavailable)
      # -----------------------------------------------------------------------
      - name: Generate SBOM for signed image (Syft)
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532  # v0.17.0
        with:
          image: '${{ steps.image-meta.outputs.image-uri }}'
          format: cyclonedx-json
          artifact-name: 'sbom-${{ inputs.service-name }}-${{ github.sha }}.cdx.json'
          output-file: sbom.cdx.json

      - name: Attest SBOM with cosign (KMS)
        run: |
          cosign attest --yes \
            --key "${{ env.COSIGN_KMS_KEY }}" \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            "${{ steps.image-meta.outputs.image-uri }}"
