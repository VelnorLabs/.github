# ---------------------------------------------------------------------------
# VelnorLabs shared eval-on-PR workflow · T-W3-020 (impl) · T-W5-003 (promotion)
#
# Stage-1 on-PR eval subset per Q-16/Q-17: a git-diff resolver
# (velnor-evals/hotfix_subset_resolver.py) classifies the PR's changed paths
# as one of {ai_harness_intersected, infra_only, mixed} and derives the
# golden-subset tags; the subset eval (velnor-evals harnesses/subset_run.py,
# recorded data-only mode — no model calls, deterministic, seconds-fast) runs
# ONLY for ai_harness_intersected (targeted tags) or mixed (full subset).
# Infra-only and tests-only PRs skip the eval entirely — that is the CI-time
# saving this workflow exists for.
#
# ADVISORY GATE AT WAVE 5 (T-W5-003, was informational at Wave 3)
# ---------------------------------------------------------------
# This job now reports conclusion=FAILURE when the eval breaches a floor:
#   - any baselined score metric > 2pp below baseline (Q-19), or
#   - refusal precision below 90% absolute (Q-19), or
#   - the eval could not produce a usable number (FAIL CLOSED).
# The decision lives in velnor-evals harnesses/gate_assertion.py, not here.
#
# IT DOES NOT BLOCK MERGE, AND NOTHING HERE SHOULD TRY TO. GitHub Free does not
# enforce branch protection or required status checks on PRIVATE repos —
# /branches/main/protection and /rulesets both 403 with "Upgrade to GitHub Pro
# or make this repository public". DEC-0062 (OPERATIVE) chose to hold that
# deferral to V1.5 rather than upgrade, and says so verbatim: "a red CI does not
# block merge by rule". A FOUNDER RULING on 2026-08-09 descoped T-W5-003 to an
# advisory gate on exactly that basis. The ready-to-apply required-check config
# is authored and UNAPPLIED at branch-protection/eval-gate-required-check.tf.
#
# 2-KEY OVERRIDE
# --------------
# `eval-override` label + 2 distinct staff approvals on the CURRENT head commit
# + a rationale section in the PR body. A valid override does NOT turn this
# check green — it is a recorded acceptance of a red gate, not an eraser. See
# velnor-evals harnesses/gate_override.py for why, and for the adversarial
# cases (self-approval, one actor twice, stale approvals, bots).
#
# FAIL CLOSED (Wave-5 invariant)
# ------------------------------
# `unreachable-evals-is-failure` defaults TRUE: a caller that cannot reach
# velnor-evals now goes RED instead of green-with-a-warning. Before this change
# velnor-iac's `eval/on-pr` check reported PASS on every PR while having
# skipped the eval entirely (its VELNOR_EVALS_READ_TOKEN does not resolve) — a
# check that has never evaluated anything is exactly the LE-374 shape: a gate
# indistinguishable from a broken one. A caller that genuinely wants the old
# degrade-to-green behaviour must now ask for it explicitly and visibly.
#
# Usage in a caller repo (.github/workflows/eval-subset-on-pr.yml):
#
#   name: eval-subset-on-pr
#   on:
#     pull_request:
#       branches: [main]
#   permissions:
#     contents: read
#     pull-requests: read      # required: the override reads reviews + labels
#   jobs:
#     eval-on-pr:
#       uses: VelnorLabs/.github/.github/workflows/_eval-on-pr.yml@main
#       # non-velnor-evals repos additionally need (see token note below):
#       # secrets:
#       #   evals-checkout-token: ${{ secrets.VELNOR_EVALS_READ_TOKEN }}
#
# changed-paths input: optional. When omitted the workflow computes
# `git diff --name-only origin/<base>...HEAD` itself (plain pull_request
# context). Passing it (T-W0-011 usage) still works.
#
# Cross-repo token note (known org gap, same as the deploy-template
# iac-checkout bug): github.token cannot read OTHER private repos, so callers
# outside velnor-evals must pass `evals-checkout-token` (org read PAT /
# GitHub App token) to fetch the resolver + golden sets.
#
# Invariants enforced:
#   - Pinned action SHAs (Invariant §4)
#   - Plain `pull_request` context only — never pull_request_target; the one
#     optional secret is a read-only checkout token, never exposed to eval code
#   - permissions: contents: read + pull-requests: read (no writes, no OIDC)
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      changed-paths:
        description: 'Optional JSON list of changed file paths; computed via git diff when omitted'
        required: false
        type: string
        default: ''
      eval-timeout-minutes:
        description: 'Maximum minutes to allow the eval subset to run'
        required: false
        type: number
        default: 15
      unreachable-evals-is-failure:
        description: >-
          Fail the check when velnor-evals cannot be fetched. Default true
          (Wave-5 fail-closed). Set false ONLY with a documented reason — it
          makes this check report success without having evaluated anything.
        required: false
        type: boolean
        default: true
    secrets:
      evals-checkout-token:
        description: 'Read token for VelnorLabs/velnor-evals (required for callers outside velnor-evals)'
        required: false

jobs:
  eval-on-pr:
    name: eval/on-pr
    runs-on: ubuntu-24.04
    # NO job-level `permissions:` block, deliberately. A job-level block
    # REPLACES inheritance, and a called workflow that requests a scope its
    # caller did not grant fails the whole run at startup. Declaring
    # `pull-requests: read` here would therefore hard-break every caller that
    # grants only `contents: read` — velnor-iac today — which is a far worse
    # outcome than a red check. Inheriting instead means each caller sets its
    # own least-privilege scopes: `contents: read` is enough for the eval, and
    # a caller that wants the 2-key override recorded adds `pull-requests:
    # read` (velnor-evals does). The override step degrades visibly when the
    # scope is absent rather than failing the run.
    timeout-minutes: ${{ fromJson(inputs.eval-timeout-minutes) }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Changed paths: input if provided (T-W0-011 compat), else git diff vs base
      # -----------------------------------------------------------------------
      - name: Collect changed paths
        id: diff
        env:
          CHANGED_PATHS_INPUT: ${{ inputs.changed-paths }}
        run: |
          set -euo pipefail
          if [ -n "$CHANGED_PATHS_INPUT" ]; then
            python3 - <<'PYEOF'
          import json, os
          raw = os.environ["CHANGED_PATHS_INPUT"]
          try:
              paths = json.loads(raw)
          except json.JSONDecodeError:
              paths = [p.strip() for p in raw.strip().splitlines() if p.strip()]
          with open("changed_paths.txt", "w") as fh:
              fh.write("\n".join(str(p) for p in paths) + "\n")
          PYEOF
          else
            BASE_REF="${GITHUB_BASE_REF:-main}"
            git fetch --quiet origin "$BASE_REF"
            git diff --name-only "origin/${BASE_REF}...HEAD" > changed_paths.txt
          fi
          echo "Changed paths:"
          sed 's/^/  /' changed_paths.txt || true

      # -----------------------------------------------------------------------
      # Resolver + golden sets: local when the caller IS velnor-evals; otherwise
      # fetched from VelnorLabs/velnor-evals (needs evals-checkout-token).
      # -----------------------------------------------------------------------
      - name: Checkout velnor-evals (cross-repo caller)
        id: evals-remote
        if: github.repository != 'VelnorLabs/velnor-evals'
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: VelnorLabs/velnor-evals
          ref: main
          path: .velnor-evals
          token: ${{ secrets.evals-checkout-token || github.token }}
          # Do not leave the read token in .velnor-evals/.git config where
          # later steps (running evals code) could read it back.
          persist-credentials: false

      - name: Resolve evals dir (fail closed when unreachable)
        id: evals
        env:
          UNREACHABLE_IS_FAILURE: ${{ inputs.unreachable-evals-is-failure }}
        run: |
          set -euo pipefail
          if [ "${{ github.repository }}" = "VelnorLabs/velnor-evals" ]; then
            echo "dir=${GITHUB_WORKSPACE}" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ -f ".velnor-evals/hotfix_subset_resolver.py" ]; then
            echo "dir=${GITHUB_WORKSPACE}/.velnor-evals" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            MSG="Cannot fetch VelnorLabs/velnor-evals (resolver + golden sets). Pass secrets.evals-checkout-token from the caller — github.token cannot read other private repos."
            {
              echo "## eval/on-pr"
              echo ""
              echo "**velnor-evals is not reachable — nothing was evaluated.**"
              echo ""
              echo "$MSG"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$UNREACHABLE_IS_FAILURE" = "true" ]; then
              echo "::error title=eval/on-pr FAILS CLOSED::${MSG} This check reports FAILURE rather than a green tick it did not earn (Wave-5 fail-closed invariant). Fix the token, or set unreachable-evals-is-failure: false in the caller with a documented reason."
              exit 1
            fi
            echo "::warning title=eval/on-pr degraded::${MSG} The caller has opted out of fail-closed, so this check is reporting SUCCESS WITHOUT HAVING EVALUATED ANYTHING."
          fi

      - name: Set up Python
        if: steps.evals.outputs.available == 'true'
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install runner deps (pyyaml only — recorded eval is offline)
        if: steps.evals.outputs.available == 'true'
        run: python3 -m pip install --quiet "pyyaml>=6.0.2,<7"

      # -----------------------------------------------------------------------
      # Q-16/Q-17 resolver: changed files → intersection class + subset tags
      # -----------------------------------------------------------------------
      - name: Resolve intersection + subset (Q-16/Q-17)
        if: steps.evals.outputs.available == 'true'
        id: resolve
        env:
          EVALS_DIR: ${{ steps.evals.outputs.dir }}
        run: |
          set -euo pipefail
          python3 "${EVALS_DIR}/hotfix_subset_resolver.py" \
            --repo "${{ github.repository }}" \
            --files-from changed_paths.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: Skip eval (infra-only / tests-only PR)
        if: steps.evals.outputs.available == 'true' && steps.resolve.outputs.run_eval != 'true'
        run: |
          echo "Intersection: ${{ steps.resolve.outputs.intersection }} — eval skipped (Q-17)."
          {
            echo "## eval/on-pr"
            echo "- classification: \`${{ steps.resolve.outputs.intersection }}\`"
            echo "- eval: **skipped** — no AI-Harness-intersecting production paths (CI time saved)"
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # 2-key override state. Read-only, and deliberately BEFORE the gate so the
      # summary can report both. It never changes the job's exit status.
      # -----------------------------------------------------------------------
      - name: Read 2-key override state
        id: override
        if: steps.evals.outputs.available == 'true' && steps.resolve.outputs.run_eval == 'true' && github.event_name == 'pull_request'
        # Reporting only — it never decides the job's exit status, so a missing
        # `pull-requests: read` scope or a transient API error must not mask the
        # gate verdict. Degrading here is safe in one direction only: the check
        # is already red whenever an override matters, and a failure to READ an
        # override can only lose the record, never fabricate one.
        continue-on-error: true
        env:
          EVALS_DIR: ${{ steps.evals.outputs.dir }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Absolute paths throughout: this step runs with working-directory set
          # to the EVALS dir, which for a cross-repo caller is
          # $GITHUB_WORKSPACE/.velnor-evals — so a bare `> pr.json` would land
          # somewhere the later steps and the artifact upload do not look.
          PR_JSON="${GITHUB_WORKSPACE}/pr.json"
          REVIEWS_JSON="${GITHUB_WORKSPACE}/reviews.json"
          PERMS_JSON="${GITHUB_WORKSPACE}/permissions.json"

          gh api "repos/${REPO}/pulls/${PR_NUMBER}" > "$PR_JSON"
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/reviews" > "$REVIEWS_JSON"

          # Staff status is resolved LIVE from the collaborator API, never from
          # a list committed in this repo (LE-337/LE-352: enumerations derive).
          # A lookup that fails (404 = not a collaborator) yields "", which is
          # not a staff permission — absent must never read as granted.
          echo '{}' > "$PERMS_JSON"
          for login in $(jq -r '.[] | select((.user.type // "") != "Bot") | .user.login' "$REVIEWS_JSON" | sort -fu); do
            perm="$(gh api "repos/${REPO}/collaborators/${login}/permission" --jq '.permission' 2>/dev/null || echo "")"
            jq --arg l "$login" --arg p "$perm" '. + {($l): $p}' "$PERMS_JSON" > "${PERMS_JSON}.tmp"
            mv "${PERMS_JSON}.tmp" "$PERMS_JSON"
          done

          python3 -m harnesses.gate_override_cli \
            --pr-json "$PR_JSON" \
            --reviews-json "$REVIEWS_JSON" \
            --permissions-json "$PERMS_JSON" \
            --out "${GITHUB_WORKSPACE}/override.json"
        working-directory: ${{ steps.evals.outputs.dir }}

      # -----------------------------------------------------------------------
      # THE GATE. Exits nonzero on a breach — this is the deliverable.
      # -----------------------------------------------------------------------
      - name: Eval gate assertion (advisory — reports failure, does not block merge)
        if: steps.evals.outputs.available == 'true' && steps.resolve.outputs.run_eval == 'true'
        id: gate
        env:
          EVALS_DIR: ${{ steps.evals.outputs.dir }}
          SUBSET_TAGS: ${{ steps.resolve.outputs.subset_tags }}
        run: |
          set -euo pipefail
          cd "$EVALS_DIR"
          START=$(date +%s)
          set +e
          python3 -m harnesses.gate_assertion \
            --tags "$SUBSET_TAGS" \
            --json-out "${GITHUB_WORKSPACE}/gate.json" \
            --summary-out "${GITHUB_WORKSPACE}/gate_summary.md"
          GATE_RC=$?
          set -e
          ELAPSED=$(( $(date +%s) - START ))

          {
            cat "${GITHUB_WORKSPACE}/gate_summary.md"
            echo ""
            echo "- classification: \`${{ steps.resolve.outputs.intersection }}\`"
            echo "- runtime: ${ELAPSED}s (budget: 5min)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f "${GITHUB_WORKSPACE}/override.json" ]; then
            python3 - <<'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          o = json.load(open(os.path.join(os.environ["GITHUB_WORKSPACE"], "override.json")))
          print("")
          print("### 2-key override")
          print("")
          if not o["requested"]:
              print("- not requested")
          elif o["valid"]:
              print(f"- **ACCEPTED** — co-signed by {', '.join(o['approvers'])}")
              print(f"- rationale: {o['rationale']}")
              print("")
              print("> The check still reports failure. An override records that two "
                    "staff knowingly accepted a red eval gate; it does not assert the "
                    "gate passed. `audit_event(eval_gate_override)` is the durable record.")
          else:
              print("- **REJECTED**")
              for r in o["rejections"]:
                  print(f"  - {r}")
          PYEOF
          fi

          exit "$GATE_RC"

      - name: Upload gate + override evidence
        if: always() && steps.evals.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: eval-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            gate.json
            override.json
          if-no-files-found: ignore
          retention-days: 30
