# ---------------------------------------------------------------------------
# VelnorLabs shared deploy template · T-W0-012
#
# Callable via `workflow_call` so each service repo's deploy.yml stays ~10 lines.
# Provides: Stage 3 (Deploy Dev) → Stage 4 (Integration tests)
#
# Stage 3 (deploy-dev): auto on every call
#   tofu apply → ecs update-service → wait stable → atlas migrate → smoke test
# Stage 4 (integration-tests): auto after Stage 3 passes
#   contract check → isolation audit → concierge classifier smoke
#
# Usage in a caller repo (.github/workflows/deploy.yml):
#
#   jobs:
#     deploy:
#       uses: VelnorLabs/.github/.github/workflows/_deploy-template.yml@main
#       with:
#         service: velnor-chat-api
#         image_tag: ${{ needs.ci.outputs.image-uri }}
#       secrets: inherit
#
# Invariants enforced:
#   - Pinned action SHAs (Invariant §4)
#   - OIDC auth — no static AWS keys (T-W0-010 requirement)
#   - No hardcoded secrets — all via ${{ secrets.X }} or OIDC
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      service:
        description: 'Service name (e.g. chat-api, agent-gateway)'
        required: true
        type: string
      image_tag:
        description: 'Full ECR URI with tag (e.g. 113831183566.dkr.ecr.us-east-1.amazonaws.com/velnor-chat-api:abc123)'
        required: true
        type: string
      environment:
        description: 'Target environment (dev | staging | prod)'
        required: false
        type: string
        default: dev
      ecs_cluster:
        description: "ECS cluster name to deploy to"
        required: false
        type: string
        default: "velnor-dev-cluster"
      health_check:
        description: >-
          Whether the service exposes an HTTP /healthz behind the saas ALB.
          Set false for worker-type services (e.g. embed-worker) that have no
          public route, so the healthz + e2e HTTP smoke tests are skipped (they
          would 404 and fail Stage 3 for a queue-only worker). The deploy and the
          ECS stability wait still run. (This used to say "and Atlas migrations
          still run" — they did not, and the step is now gone; see LE-372.)
        required: false
        type: boolean
        default: true
    # No `secrets:` block. AWS_ACCOUNT_ID is an environment-scoped VARIABLE
    # (vars.AWS_ACCOUNT_ID), not a secret. There is intentionally no AWS_REGION
    # secret either — the `secrets` context is NOT available in a workflow-level
    # `env:` block, so referencing it there startup_failures every deploy. Region
    # is not sensitive and is hardcoded in env: below.
    outputs:
      deploy_status:
        description: 'Result of Stage 3 deploy-dev job (success | failure)'
        value: ${{ jobs.deploy-dev.outputs.deploy_status }}
      integration_status:
        description: 'Result of Stage 4 integration-tests job (success | failure)'
        value: ${{ jobs.integration-tests.outputs.integration_status }}

env:
  AWS_REGION: 'us-east-1'
  # Stage-3 assumes the dedicated DEPLOY role (velnor-github-deploy), which can
  # decrypt TF state + mutate ECS/IAM/EC2/Logs — NOT the locked-down CI role
  # (velnor-github-actions, which is denied state KMS decrypt). The deploy role
  # is assumable only from main + the approval-gated `dev` environment. (LE-028)
  GHA_ROLE_ARN: 'arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/velnor-github-deploy'
  ECS_CLUSTER: ${{ inputs.ecs_cluster }}
  IAC_REPO_PATH: 'velnor-iac'

# ---------------------------------------------------------------------------
# Stage 3: Deploy Dev — tofu apply → ECS update → wait stable → atlas migrate → smoke
# Runs on every workflow_call invocation.
# ---------------------------------------------------------------------------
jobs:
  deploy-dev:
    # "atlas migrate" deliberately dropped from this name (LE-372): the step it
    # referred to no-op'd on every deploy and has been removed. A stage name is
    # read as a claim about what the stage does.
    name: Stage 3 · tofu apply → ECS update → smoke
    runs-on: ubuntu-latest
    # Two gates, both required:
    #   1. AWS_ACCOUNT_ID set (account wired).
    #   2. DEPLOY_DEV_ENABLED == 'true' — an explicit opt-in flipped ONLY after the
    #      per-service ECS terraform + IAM deploy permissions are confirmed and a
    #      reviewed first `tofu apply` has succeeded manually. This prevents an
    #      auto-approve apply firing against infra that isn't deploy-ready.
    if: vars.AWS_ACCOUNT_ID != '' && vars.DEPLOY_DEV_ENABLED == 'true'
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write    # OIDC token for AWS
      contents: read
    outputs:
      deploy_status: ${{ steps.set-status.outputs.deploy_status }}

    steps:
      - name: Checkout calling repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # Checkout velnor-iac to a subdirectory so atlas_migrate.sh is available.
      # NOTE: github.token is scoped to the *calling* repo only and cannot clone
      # a separate private repo (returns "Not Found"). velnor-iac is a different
      # private repo, so this needs a token with contents:read on velnor-iac.
      # Each calling service repo provides IAC_REPO_TOKEN (repo-level secret,
      # passed through via `secrets: inherit`); org-level secrets can't be
      # consumed by private repos on the current plan.
      - name: Checkout velnor-iac
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: VelnorLabs/velnor-iac
          path: ${{ env.IAC_REPO_PATH }}
          token: ${{ secrets.IAC_REPO_TOKEN }}

      # -----------------------------------------------------------------------
      # Step 1: OIDC — assume velnor-github-actions role
      # -----------------------------------------------------------------------
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: ${{ env.GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ inputs.service }}-${{ github.run_id }}

      - name: Verify AWS identity (OIDC smoke test)
        run: aws sts get-caller-identity

      # -----------------------------------------------------------------------
      # Step 2: tofu apply — update ECS task definition for this service
      # -----------------------------------------------------------------------
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f  # v1
        with:
          tofu_version: '1.12.0'

      - name: tofu init (ecs/${{ inputs.service }} workspace)
        working-directory: ${{ env.IAC_REPO_PATH }}/accounts/dev/ecs/${{ inputs.service }}
        run: |
          tofu init -input=false

      - name: tofu apply (ECS task definition for ${{ inputs.service }})
        working-directory: ${{ env.IAC_REPO_PATH }}/accounts/dev/ecs/${{ inputs.service }}
        run: |
          tofu apply -auto-approve \
            -var="image_tag=${{ inputs.image_tag }}" \
            -input=false

      # -----------------------------------------------------------------------
      # Step 3: Force new ECS deployment
      # -----------------------------------------------------------------------
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "velnor-${{ inputs.service }}" \
            --force-new-deployment \
            --output json | jq '.service.deployments[0] | {status, taskDefinition, desiredCount}'

      # -----------------------------------------------------------------------
      # Step 4: Wait for ECS service stability
      #
      # LE-312 · the plain waiter's default window (40 × 15s = 10 min) FALSE-FAILS
      # for services with Service Connect + an ALB target group (action-gate did
      # it twice on 2026-07-26): draining the old task through the SC proxy AND
      # the ALB pushes convergence just past 10 min, the waiter exits 255, and
      # ECS completes the rollout on its own minutes later. A red that means
      # "slow" erodes trust in a red that means "broken". On timeout, consult
      # ECS's own deployment state machine: COMPLETED => success; IN_PROGRESS =>
      # one more waiter round (~20 min ceiling total); anything else (FAILED,
      # circuit-breaker) => fail loud with the recent service events.
      # -----------------------------------------------------------------------
      - name: Wait for ECS service stability
        run: |
          cluster="${{ env.ECS_CLUSTER }}"
          service="velnor-${{ inputs.service }}"
          repo="velnor-${{ inputs.service }}"
          tag="${{ inputs.image_tag }}"

          rollout_state() {
            aws ecs describe-services --cluster "$cluster" --services "$service" \
              --query 'services[0].deployments[0].rolloutState' --output text
          }

          # diagnose prints everything needed to tell WHY a deploy failed, and is
          # reached from EVERY failure exit (LE-322). The previous version only
          # dumped events on the catch-all branch, while the branch most likely to
          # be taken on a real failure — IN_PROGRESS, then a second timeout — ran a
          # bare `aws ecs wait` as its last command. Under Actions' default
          # `bash -e` that killed the step on the waiter's own exit code, so the
          # diagnostics never ran: a genuine failure produced two identical
          # "Max attempts exceeded" lines and nothing else.
          diagnose() {
            echo "::group::Deploy failure diagnostics"
            echo "--- rolloutState ---"
            aws ecs describe-services --cluster "$cluster" --services "$service" \
              --query 'services[0].deployments[0].{state:rolloutState,reason:rolloutStateReason,desired:desiredCount,running:runningCount,pending:pendingCount,failed:failedTasks}' \
              --output json || true
            # An ABSENT IMAGE is a common cause and is invisible in the waiter's
            # own error. Naming it directly turns a 20-minute diagnosis into a
            # 5-second one — this is exactly how the admin-api failure that
            # motivated LE-322 was eventually root-caused, by hand, afterwards.
            echo "--- image $repo:$tag present in ECR? ---"
            if aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$tag" \
                 --query 'imageDetails[0].imagePushedAt' --output text 2>/dev/null; then
              echo "image found"
            else
              echo "IMAGE NOT FOUND IN ECR — the task cannot be pulled."
              echo "Most likely the CI build/push stage failed or is still running."
            fi
            echo "--- 10 most recent service events ---"
            aws ecs describe-services --cluster "$cluster" --services "$service" \
              --query 'services[0].events[0:10].message' --output json || true
            echo "--- most recent stopped task ---"
            task="$(aws ecs list-tasks --cluster "$cluster" --service-name "$service" \
              --desired-status STOPPED --max-items 1 --query 'taskArns[0]' --output text 2>/dev/null)"
            if [ -n "$task" ] && [ "$task" != "None" ]; then
              aws ecs describe-tasks --cluster "$cluster" --tasks "$task" \
                --query 'tasks[0].{stoppedReason:stoppedReason,containers:containers[].{name:name,exitCode:exitCode,reason:reason}}' \
                --output json || true
            else
              echo "(no stopped task to report)"
            fi
            echo "::endgroup::"
          }

          echo "Waiting for $service to stabilize on $cluster..."
          if aws ecs wait services-stable --cluster "$cluster" --services "$service"; then
            echo "ECS service is stable."
            exit 0
          fi
          state="$(rollout_state)"
          echo "First stability wait timed out; rolloutState=$state"
          case "$state" in
            COMPLETED)
              echo "Rollout completed despite the waiter timeout (slow SC/ALB drain, LE-312)."
              ;;
            IN_PROGRESS)
              echo "Rollout still converging — waiting one more round..."
              # Guarded, not bare: a second timeout must reach diagnose() rather
              # than terminating the step on the waiter's exit code.
              if aws ecs wait services-stable --cluster "$cluster" --services "$service"; then
                echo "ECS service is stable (second round)."
              else
                echo "Second stability wait ALSO timed out — this is a genuine failure."
                echo "Note the ~20 min ceiling is now exhausted; see LE-320 on why a"
                echo "1-task rollout on this cluster takes ~12 min in the first place."
                diagnose
                exit 1
              fi
              ;;
            *)
              echo "Rollout state '$state' — genuine deploy failure."
              diagnose
              exit 1
              ;;
          esac

      # -----------------------------------------------------------------------
      # Step 5: (removed) Atlas migrations — LE-372
      # -----------------------------------------------------------------------
      # This step ran `velnor-iac/scripts/atlas_migrate.sh dev` and installed the
      # Atlas CLI to support it. Both are gone, and NOTHING REPLACES THEM HERE:
      # this pipeline no longer runs migrations at all.
      #
      # IT NEVER DID. atlas_migrate.sh defaults MIGRATIONS_DIR to
      # velnor-iac/db/migrations, a directory that does not exist in that repo —
      # the catalogs live in velnor-plane-api/migrations/<vertical>/. So the step
      # printed "No migrations directory present ... Skipping atlas apply
      # (no-op)" and exited 0 on every deploy of every service, while a step
      # named "Run Atlas migrations (dev)" went green. Verified on velnor-user-api
      # run 30647594122. The script's own header has said DEPRECATED — Do not use
      # since LE-099; what nobody noticed is that this template called it anyway.
      #
      # WORSE THAN DEAD WEIGHT, which is why it is deleted rather than left: the
      # missing directory was the ONLY thing preventing it from running for real.
      # This step had no continue-on-error, and the script exits 1 on any tenant
      # failure — so the day someone added velnor-iac/db/migrations, every deploy
      # in the org would have started attempting live per-tenant applies with a
      # static-password DSN the DEC-0061 RDS Proxy rejects, no vertical-awareness
      # (DEC-0064), and an unnormalized velnor_t_${slug} that yields
      # velnor_t_gym-sb for a hyphenated tenant (LE-310/LE-324) — and gone red.
      #
      # THE REAL PER-TENANT ROLLOUT is the apply-registry Fargate task in
      # velnor-iac accounts/dev/codebuild/atlas_tenant_rollout.tf, which reads the
      # tenant→vertical mapping from velnor.tenants and mints an RDS IAM token at
      # runtime. It is deliberately NOT wired here: a per-service deploy should
      # not trigger a fleet-wide per-tenant migration. Run it on demand — see that
      # file's header.
      # -----------------------------------------------------------------------
      # Step 6: Smoke tests — healthz (INFORMATIONAL) + e2e chat round-trip stub
      #
      # The healthz probe is NON-GATING (LE-217). Real health is already enforced
      # upstream: the ECS deployment circuit breaker waits for steady state, and the
      # ALB target-group health check must pass before the new task takes traffic —
      # a service that can't serve /healthz never goes healthy, so the rollout (and
      # this job) fails before ever reaching this step. This external probe is
      # redundant with that, and it cannot run reliably from a GitHub-hosted runner:
      # the SaaS ALB is behind Cloudflare (origin cutover), whose edge blocks the
      # runner's datacenter IP with a 403 block page (verified: 5 KB CF block body
      # vs the ALB's 71-byte 403; the same URL is 200 from a normal client). So this
      # logs the edge-visible result without turning a health-verified deploy red.
      # -----------------------------------------------------------------------
      - name: Smoke test — healthz (informational)
        if: inputs.health_check
        continue-on-error: true
        run: |
          echo "Edge healthz probe for ${{ inputs.service }} (informational — ECS rollout + ALB health already gated this deploy)."
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "https://dev.velnor.ai/api/v1/${{ inputs.service }}/healthz" || echo "000")
          echo "edge healthz -> HTTP $CODE  (200 = reachable via Cloudflare; 403 = CF edge-blocked this runner IP, expected from hosted runners; 000 = unreachable — none of these fail the deploy)"

      - name: Smoke test — e2e chat round-trip (stub)
        if: inputs.health_check
        run: |
          echo "Running e2e chat round-trip stub for ${{ inputs.service }}..."
          # STUB: Real e2e test wired in T-W4-xxx; placeholder asserts endpoint reachable
          curl -f --retry 3 --retry-delay 3 \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"message":"ping","session_id":"smoke-test-001"}' \
            "https://dev.velnor.ai/api/v1/${{ inputs.service }}/chat" \
            || echo "STUB: e2e round-trip endpoint not yet live — non-fatal for Stage 3"
          echo "e2e stub complete"

      - name: Set deploy status output
        id: set-status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "deploy_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_status=failure" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Stage 4: Integration tests — cross-service contract + isolation audit + concierge
  # Hard gates: continue-on-error: false for all steps
  # Runs after Stage 3 (deploy-dev) passes.
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Stage 4 · contract check → isolation audit → concierge classifier
    needs: deploy-dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # OIDC for AWS CodeBuild + agent-gateway calls
      contents: read
    outputs:
      integration_status: ${{ steps.set-integration-status.outputs.integration_status }}

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: ${{ env.GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-integration-${{ inputs.service }}-${{ github.run_id }}

      # -----------------------------------------------------------------------
      # Step 1: Cross-service contract check
      # Probes /healthz for each known Velnor V1 service. INFORMATIONAL: a non-200
      # (e.g. a service not yet built in this environment) is a WARNING, not a
      # failure. The service just deployed is already hard-gated by the Stage 3
      # smoke test; this step must not turn a healthy deploy red on account of
      # unbuilt peers (LE-059 — billing-api/tenant-api/doc-service are 503 in dev).
      # -----------------------------------------------------------------------
      - name: Cross-service contract check
        continue-on-error: false
        run: |
          set -euo pipefail
          BASE="https://dev.velnor.ai/api/v1"
          SERVICES=(
            "chat-api"
            "agent-gateway"
            "billing-api"
            "tenant-api"
            "doc-service"
          )
          OK=0
          WARN=0
          for svc in "${SERVICES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              "$BASE/$svc/healthz" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "  [OK]   $svc → HTTP $STATUS"
              OK=$((OK + 1))
            else
              echo "  [WARN] $svc → HTTP $STATUS (not yet healthy/built — non-fatal)"
              WARN=$((WARN + 1))
            fi
          done
          echo "Cross-service contract check: $OK healthy, $WARN unhealthy (non-fatal)."

      # -----------------------------------------------------------------------
      # Step 2: Isolation audit smoke — trigger the isolation-audit CodeBuild project
      # NON-FATAL T-W4 stub (LE-059): the real isolation-audit project + hard
      # assertion are wired in T-W4. Until then a missing/unprovisioned project or
      # a non-SUCCEEDED build is a WARNING, not a deploy failure — the deployed
      # service is already gated by the Stage 3 smoke test. (The named project
      # velnor-atlas-nightly is not provisioned in dev; real projects are
      # velnor-atlas-replay-nightly + velnor-isolation-audit-weekly.)
      # -----------------------------------------------------------------------
      - name: Isolation audit smoke (CodeBuild)
        continue-on-error: false
        run: |
          set -uo pipefail
          PROJECT="velnor-atlas-nightly"
          echo "Starting $PROJECT CodeBuild build..."
          BUILD_ID=$(aws codebuild start-build \
            --project-name "$PROJECT" \
            --query 'build.id' \
            --output text 2>&1) || {
            echo "WARN: could not start $PROJECT — non-fatal T-W4 stub. ($BUILD_ID)"
            exit 0
          }
          echo "Build ID: $BUILD_ID"

          # Poll for completion (max 10 minutes)
          TIMEOUT=600
          ELAPSED=0
          POLL_INTERVAL=15
          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(aws codebuild batch-get-builds \
              --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' \
              --output text 2>/dev/null || echo "UNKNOWN")
            echo "  [${ELAPSED}s] Build status: $STATUS"
            case "$STATUS" in
              SUCCEEDED)
                echo "Isolation audit build SUCCEEDED."
                exit 0
                ;;
              FAILED|STOPPED|TIMED_OUT)
                echo "WARN: isolation audit build $STATUS — non-fatal T-W4 stub."
                exit 0
                ;;
              *)
                sleep $POLL_INTERVAL
                ELAPSED=$((ELAPSED + POLL_INTERVAL))
                ;;
            esac
          done
          echo "WARN: isolation audit did not finish in ${TIMEOUT}s — non-fatal T-W4 stub."
          exit 0

      # -----------------------------------------------------------------------
      # Step 3: Concierge classifier smoke — call agent-gateway /run with DIRECT intent
      # Asserts response contains expected intent field.
      # Hard gate: continue-on-error: false
      # -----------------------------------------------------------------------
      - name: Concierge classifier smoke (agent-gateway DIRECT intent)
        continue-on-error: false
        run: |
          set -euo pipefail
          echo "Running concierge classifier smoke test..."
          # STUB: Real harness invocation wired in T-W4-xxx
          # Sends a DIRECT intent payload and asserts the response is 200 + contains intent field
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            --max-time 15 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Velnor-Tenant-Id: smoke-test-tenant" \
            -d '{"intent":"DIRECT","message":"What is my current invoice?","session_id":"smoke-integ-001"}' \
            "https://dev.velnor.ai/api/v1/agent-gateway/run")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP status: $HTTP_STATUS"
          echo "Response body: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "STUB: agent-gateway /run not yet live (HTTP $HTTP_STATUS) — treating as non-fatal stub"
            echo "Real assertion will be enforced in T-W4-xxx once agent-gateway is deployed."
            exit 0
          fi
          # Assert intent field present in response
          if echo "$BODY" | grep -q '"intent"'; then
            echo "Concierge classifier smoke PASSED — intent field present."
          else
            echo "Concierge classifier smoke FAILED — missing intent field in response."
            exit 1
          fi

      - name: Set integration status output
        id: set-integration-status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "integration_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "integration_status=failure" >> "$GITHUB_OUTPUT"
          fi
